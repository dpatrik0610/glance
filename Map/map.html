<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    /* Rounded like Glance's cards: the WebView is transparent, so the corners show the glass behind */
    #map { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #141416;
           font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; outline: 1px solid rgba(255,255,255,.12); outline-offset: -1px; }
    .leaflet-container { background: #141416; }
    /* OpenStreetMap's light tiles turned dark: invert, then rotate hues back so water stays blue and parks green */
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.45); }
    .leaflet-control-attribution { background: rgba(20,20,22,.75) !important; color: #6a6a72; font-size: 10px; border-radius: 8px 0 0 0; }
    .leaflet-control-attribution a { color: #9c9ca3; }
    .leaflet-bar { border: 1px solid rgba(255,255,255,.12) !important; border-radius: 12px !important; overflow: hidden; box-shadow: none !important; }
    .leaflet-bar a { background: rgba(28,28,32,.92); color: #f4f4f5; border-bottom-color: rgba(255,255,255,.08); transition: background .15s; }
    .leaflet-bar a:hover { background: #2a2a30; color: #fff; }

    /* Pins: colored disc with a white ring; selected grows and gets a halo. New ones drop in. */
    .pin { box-sizing: border-box; width: 22px; height: 22px; border-radius: 50%; background: var(--c); border: 3px solid #fff;
           box-shadow: 0 3px 10px rgba(0,0,0,.55); transition: transform .22s cubic-bezier(.3,1.6,.5,1), box-shadow .22s; }
    .pin.sel { transform: scale(1.3); box-shadow: 0 0 0 7px color-mix(in srgb, var(--c) 35%, transparent), 0 3px 10px rgba(0,0,0,.55); }
    .pin.drop { animation: drop .5s cubic-bezier(.3,1.5,.5,1); }
    @keyframes drop { from { transform: translateY(-28px) scale(.5); opacity: 0; } }
    /* Search results: smaller hollow dots */
    .dot { box-sizing: border-box; width: 14px; height: 14px; margin: 4px; border-radius: 50%; background: #1c1c20; border: 3px solid #f4f4f5;
           box-shadow: 0 2px 8px rgba(0,0,0,.5); transition: transform .2s cubic-bezier(.3,1.6,.5,1), border-color .2s; animation: fade .3s; }
    .dot.sel { transform: scale(1.45); border-color: #FF6A3D; }
    @keyframes fade { from { opacity: 0; transform: scale(.4); } }
    .leaflet-tooltip.lbl { background: rgba(24,24,28,.94); color: #f4f4f5; border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
                           box-shadow: 0 4px 14px rgba(0,0,0,.4); font-size: 12px; padding: 3px 9px; }
    .leaflet-tooltip.lbl::before { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<script src="vendor/leaflet.js"></script>
<script>
// Glance's map. The host (Pages/MapPage.xaml.cs) owns the data and talks over postMessage.
// host → page: {t:'area', s,w,n,e} {t:'pins', items, fresh} {t:'results', items} {t:'select', id, fly}
// page → host: {t:'ready'} {t:'add', lat, lng} {t:'move', id, lat, lng} {t:'select', id} {t:'palette'}
const host = window.chrome.webview;
const send = m => host.postMessage(m);

const map = L.map('map', { zoomControl: false, maxBoundsViscosity: 1, zoomSnap: 0.5, worldCopyJump: false }).setView([47.5, 19.05], 7);
L.control.zoom({ position: 'bottomright' }).addTo(map);
map.attributionControl.setPrefix(false);
// OpenStreetMap's own tiles: free, no key, fine for personal use (their policy wants attribution and no bulk downloading).
// Only tiles on screen load; keepBuffer 1 keeps few off-screen ones around. WebView2 caches them on disk.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, keepBuffer: 1, updateWhenZooming: false,
    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
}).addTo(map);

// Locked to one city or country: no panning out of it, no zooming out past it.
let outer = null;
function area(m) {
    const b = L.latLngBounds([m.s, m.w], [m.n, m.e]);
    outer = b.pad(0.15);
    map.setMaxBounds(outer);
    limit();
    map.fitBounds(b, { animate: false });
}
// The furthest out you can zoom: the area filling the view. Depends on the view's size, so redone on resize.
function limit() {
    if (!outer) return;
    map.setMinZoom(0);
    map.setMinZoom(map.getBoundsZoom(outer));
}
map.on('resize', limit);

const markers = new Map(); // id → marker, pins and results alike
let selected = null;

function label(name) {
    const el = document.createElement('span');
    el.textContent = name; // names come from OpenStreetMap or the user: text, never HTML
    return el;
}

function place(item, cls, draggable) {
    const m = L.marker([item.lat, item.lng], {
        icon: L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11], html: `<div class="${cls}"></div>` }),
        draggable, keyboard: false, riseOnHover: true,
    }).bindTooltip(label(item.name), { direction: 'top', offset: [0, -13], className: 'lbl' })
      .on('click', () => send({ t: 'select', id: item.id }))
      .addTo(map);
    m.getElement().firstElementChild.style.setProperty('--c', item.color || '#FF6A3D');
    if (draggable) m.on('dragend', e => { const p = e.target.getLatLng(); send({ t: 'move', id: item.id, lat: p.lat, lng: p.lng }); });
    m.kind = cls.split(' ')[0];
    markers.set(item.id, m);
}

function replace(kind, items, make) {
    for (const [id, m] of markers) if (m.kind === kind) { m.remove(); markers.delete(id); }
    items.forEach(make);
    mark(selected, false);
}

function mark(id, fly) {
    markers.get(selected)?.getElement()?.firstElementChild.classList.remove('sel');
    selected = id;
    const m = markers.get(id);
    if (!m) return;
    m.getElement()?.firstElementChild.classList.add('sel');
    if (fly) map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.7 });
}

map.on('contextmenu', e => send({ t: 'add', lat: e.latlng.lat, lng: e.latlng.lng }));
document.addEventListener('keydown', e => {
    if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); send({ t: 'palette' }); }
});

host.addEventListener('message', ({ data: m }) => {
    switch (m.t) {
        case 'area': area(m); break;
        case 'pins': replace('pin', m.items, p => place(p, p.id === m.fresh ? 'pin drop' : 'pin', true)); break;
        case 'results': replace('dot', m.items, r => place(r, 'dot', false)); break;
        case 'select': mark(m.id, m.fly); break;
    }
});
send({ t: 'ready' });
</script>
</body>
</html>
