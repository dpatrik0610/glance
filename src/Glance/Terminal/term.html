<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/xterm.css">
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    #stage, #park { position: absolute; inset: 6px 4px 6px 10px; display: flex; }
    #park { display: none; }
    #stage > * { flex: 1 1 0; }
    .split { display: flex; min-width: 0; min-height: 0; }
    .split.col { flex-direction: column; }
    .p { position: relative; min-width: 0; min-height: 0; overflow: hidden; transition: opacity .15s; }
    #stage.many .p { padding: 2px 4px; }
    #stage.many .p:not(.on) { opacity: .6; }
    /* Divider: drag to resize; a hairline that brightens under the cursor */
    .bar { flex: 0 0 9px; position: relative; cursor: col-resize; }
    .col > .bar { cursor: row-resize; }
    .bar::after { content: ''; position: absolute; inset: 0 4px; background: rgba(255, 255, 255, .1); transition: background .15s; }
    .col > .bar::after { inset: 4px 0; }
    .bar:hover::after, .bar.drag::after { background: rgba(255, 255, 255, .35); }
    /* xterm paints the viewport with the theme background; keep the glass visible */
    .xterm .xterm-viewport { background: transparent !important; }
    .xterm-viewport::-webkit-scrollbar { width: 6px; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); border-radius: 3px; }
</style>
</head>
<body>
<div id="stage"></div><div id="park"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script src="vendor/addon-unicode11.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script>
// Glance's CLI renderer. One xterm per pane; the host (CliPage.xaml.cs) owns the shells and the tabs' split layouts.
// host → page: {t:'show', tree, focus} {t:'close', id} {t:'out', id, d} {t:'focus'}
//   tree: {id} a pane, or {node, col, r, a, b} a split, a taking r of the room (b below a when col, else right of it)
// page → host: {t:'in', id, d} {t:'size', id, cols, rows} {t:'active', id} {t:'split', id, d: side} {t:'closepane', id}
//              {t:'ratio', id: node, r} {t:'link', uri} {t:'palette'}
const host = window.chrome.webview;
const send = m => host.postMessage(m);

// Dimidium (as in Windows Terminal) on a transparent background, so Glance's glass shows through.
const theme = {
    background: '#00000000', foreground: '#D3D0CF', cursor: '#FF6A3D', cursorAccent: '#0F0F11',
    selectionBackground: 'rgba(90, 169, 255, .35)',
    black: '#000000', red: '#CF494C', green: '#60B442', yellow: '#DB9C11', blue: '#0575D8', magenta: '#AF5ED2', cyan: '#1DB6BB', white: '#BAB7B6',
    brightBlack: '#817E7E', brightRed: '#FF643B', brightGreen: '#37E57B', brightYellow: '#FCCD1A', brightBlue: '#688DFD', brightMagenta: '#ED6FE9', brightCyan: '#32E0FB', brightWhite: '#D3D8D9',
};

// vendor/addon-webgl.js is patched (search "67108863&"): it gave dim and italic cells a background rectangle in the
// transparent default color, drawn opaque, i.e. black bars under Claude's faded text. Redo the patch after updating it.

// Programs that paint backgrounds black (Claude CLI does) assume an opaque black terminal; here that's solid blocks
// on the glass. Black backgrounds become the default one: palette 40, 256-color 0/16/232-234, truecolor near-black.
// ponytail: a color code split across two output chunks slips through (rare, and only costs one black run).
const BLACK_BG = new Set(['40', '48;5;0', '48;5;16', '48;5;232', '48;5;233', '48;5;234']);
function clearBlackBg(d) {
    if (!d.includes('\x1b[')) return d;
    return d.replace(/\x1b\[([0-9;]*)m/g, (all, p) => {
        const a = p.split(';'), out = [];
        for (let i = 0; i < a.length; i++) {
            if (a[i] !== '38' && a[i] !== '48') { out.push(a[i] === '40' ? '49' : a[i]); continue; }
            const len = a[i + 1] === '5' ? 3 : a[i + 1] === '2' ? 5 : 1; // extended color: keep its arguments together
            const c = a.slice(i, i + len);
            i += len - 1;
            const black = c[0] === '48' && (BLACK_BG.has(c.join(';')) || (c[1] === '2' && c.slice(2).every(v => +v < 24)));
            out.push(...(black ? ['49'] : c));
        }
        return '\x1b[' + out.join(';') + 'm';
    });
}

const panes = new Map();
const stage = document.getElementById('stage'), park = document.getElementById('park');
let active = null;
const SIDES = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };

// Panes of tabs not shown wait in #park (display: none) with their state intact.
function open(id) {
    const el = document.createElement('div');
    el.className = 'p';
    park.appendChild(el);
    const term = new Terminal({
        allowTransparency: true, allowProposedApi: true, theme,
        fontFamily: '"FiraCode Nerd Font", "Cascadia Mono", monospace', fontSize: 14,
        cursorBlink: true, cursorStyle: 'bar', scrollback: 10000,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.loadAddon(new Unicode11Addon.Unicode11Addon());
    term.unicode.activeVersion = '11';
    term.loadAddon(new WebLinksAddon.WebLinksAddon((e, uri) => send({ t: 'link', uri })));
    term.open(el);
    try { term.loadAddon(new WebglAddon.WebglAddon()); } catch { /* no GPU: DOM renderer */ }

    term.onData(d => send({ t: 'in', id, d }));
    term.onResize(({ cols, rows }) => send({ t: 'size', id, cols, rows }));
    term.textarea.addEventListener('focus', () => { activate(id); send({ t: 'active', id }); });
    new ResizeObserver(() => { if (el.clientWidth) fit.fit(); }).observe(el);

    // Windows Terminal habits: Ctrl+C copies when something is selected, Ctrl+V pastes,
    // Alt+Shift+arrow splits that way, Alt+arrow moves to the pane there, Ctrl+Shift+W closes the pane.
    term.attachCustomKeyEventHandler(e => {
        if (e.type !== 'keydown') return true;
        const side = SIDES[e.key];
        if (side && e.altKey && !e.ctrlKey) {
            if (e.shiftKey) send({ t: 'split', id, d: side });
            else if (!move(side)) return true; // no pane that way: the shell gets the key
            e.preventDefault();
            return false;
        }
        if (!e.ctrlKey || e.altKey) return true;
        const k = e.key.toLowerCase();
        if (k === 'w' && e.shiftKey) { e.preventDefault(); send({ t: 'closepane', id }); return false; }
        if (k === 'c' && (e.shiftKey || term.hasSelection())) {
            navigator.clipboard.writeText(term.getSelection());
            term.clearSelection();
            return false;
        }
        if (k === 'v') return false; // skip xterm; the browser's own paste event reaches it
        if (k === 'k' && !e.shiftKey) { e.preventDefault(); send({ t: 'palette' }); return false; } // Glance's command palette
        return true;
    });
    // Right-click: copy the selection, or paste.
    el.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (term.hasSelection()) { navigator.clipboard.writeText(term.getSelection()); term.clearSelection(); }
        else navigator.clipboard.readText().then(text => term.paste(text));
    });

    const p = { term, fit, el };
    panes.set(id, p);
    return p;
}

function activate(id) {
    active = id;
    for (const [k, p] of panes) p.el.classList.toggle('on', k === id);
}

// Lays a tab out: its panes move onto the stage, everything else back to #park.
function show(tree, focus) {
    for (const p of panes.values()) park.appendChild(p.el);
    const shown = [];
    stage.replaceChildren(build(tree, shown));
    stage.classList.toggle('many', shown.length > 1);
    activate(focus);
    for (const id of shown) {
        const { term, fit } = panes.get(id);
        fit.fit();
        // Always report: the host starts a shell on its first size, and fit() only fires onResize on change.
        send({ t: 'size', id, cols: term.cols, rows: term.rows });
    }
    panes.get(focus)?.term.focus();
}

function build(n, shown) {
    if (n.id !== undefined) {
        const p = panes.get(n.id) ?? open(n.id);
        p.el.style.flex = '';
        shown.push(n.id);
        return p.el;
    }
    const box = document.createElement('div'), bar = document.createElement('div');
    box.className = n.col ? 'split col' : 'split';
    bar.className = 'bar';
    const a = build(n.a, shown), b = build(n.b, shown);
    const set = r => { a.style.flex = `${r} 1 0`; b.style.flex = `${1 - r} 1 0`; };
    set(n.r);
    bar.addEventListener('pointerdown', e => {
        bar.setPointerCapture(e.pointerId);
        bar.classList.add('drag');
        let r = n.r;
        bar.onpointermove = e => {
            const rc = box.getBoundingClientRect();
            r = Math.min(.95, Math.max(.05, n.col ? (e.clientY - rc.top) / rc.height : (e.clientX - rc.left) / rc.width));
            set(r);
        };
        bar.onpointerup = () => {
            bar.onpointermove = bar.onpointerup = null;
            bar.classList.remove('drag');
            n.r = r;
            send({ t: 'ratio', id: n.node, r });
            panes.get(active)?.term.focus();
        };
    });
    box.append(a, bar, b);
    return box;
}

// Focuses the nearest shown pane on that side of the active one.
function move(side) {
    const cur = panes.get(active)?.el.getBoundingClientRect();
    if (!cur) return false;
    let best = null, dist = Infinity;
    for (const [id, p] of panes) {
        if (id === active || p.el.parentElement === park) continue;
        const r = p.el.getBoundingClientRect();
        const there = side === 'left' ? r.right <= cur.left + 1 : side === 'right' ? r.left >= cur.right - 1
            : side === 'up' ? r.bottom <= cur.top + 1 : r.top >= cur.bottom - 1;
        const d = Math.hypot(r.x + r.width / 2 - cur.x - cur.width / 2, r.y + r.height / 2 - cur.y - cur.height / 2);
        if (there && d < dist) [best, dist] = [p, d];
    }
    best?.term.focus();
    return !!best;
}

host.addEventListener('message', ({ data: m }) => {
    switch (m.t) {
        case 'out': panes.get(m.id)?.term.write(clearBlackBg(m.d)); break;
        case 'show': show(m.tree, m.focus); break;
        case 'close': { const p = panes.get(m.id); if (p) { p.term.dispose(); p.el.remove(); panes.delete(m.id); } break; }
        case 'focus': panes.get(active)?.term.focus(); break;
    }
});

send({ t: 'ready' });
</script>
</body>
</html>
